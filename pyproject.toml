[project]
name = "envious-social-mcp"
version = "0.1.0"
description = "Social media posting MCP server for Claude Code — X, YouTube, LinkedIn, Facebook, Instagram, TikTok"
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]>=1.0.0",
    "requests-oauthlib>=2.0.0",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["connectors"]
